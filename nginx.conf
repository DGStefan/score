server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Achter de Cloudflare-tunnel: relatieve redirects (anders wordt https → http)
    absolute_redirect off;

    # Bestanden met een hash in de naam veranderen nooit: lang cachen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML, manifest en service worker altijd vers ophalen, zodat updates direct doorkomen.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
